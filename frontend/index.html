<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130f" />
    <meta name="description" content="Milo is a warm, calm AI chat. Ask anything and watch the answer arrive word by word." />
    <title>Milo | Think out loud</title>
    <!-- Apply the saved theme before anything paints (see src/shared/theme/theme.js). -->
    <script>
      try {
        var t = localStorage.getItem('milo-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
